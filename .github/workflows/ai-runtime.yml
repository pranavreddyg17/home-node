name: Development AI runtime
on:
  push:
    branches: [main]
    paths:
      - 'packaging/guest/build_ai_runtime.py'
      - '.github/workflows/ai-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install disposable compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make
      - name: Fetch pinned inference source
        run: |
          git init "$RUNNER_TEMP/llama-source"
          git -C "$RUNNER_TEMP/llama-source" remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C "$RUNNER_TEMP/llama-source" fetch --depth=1 origin 7fe450e19305b828c199d602c23a8337aaa1f03b
          git -C "$RUNNER_TEMP/llama-source" checkout --detach FETCH_HEAD
      - name: Compile CPU development runtime
        env:
          HOMENODE_AI_RUNTIME_BUILD: '1'
        run: python3 -B -u packaging/guest/build_ai_runtime.py "$RUNNER_TEMP/llama-source" "$RUNNER_TEMP/ai-runtime"
      - name: Retain unsigned runtime candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homenode-development-ai-runtime
          path: ${{ runner.temp }}/ai-runtime/artifacts/
          retention-days: 7
          if-no-files-found: error
