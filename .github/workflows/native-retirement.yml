name: Reserved video retirement components
on:
  push:
    paths:
      - 'internal/supervisor/**'
      - 'internal/state/**'
      - 'internal/guestproto/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/native-retirement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  socket:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: true
      - name: Verify retirement provenance and journal races
        run: go test -race ./internal/supervisor -run '^TestVideoRetirement' -count=1
      - name: Verify inode-qualified socket, volume and directory retirement on disposable Linux
        run: |
          set -euo pipefail
          go version
          git rev-parse HEAD
          uname -r
          go test -c -o "$RUNNER_TEMP/supervisor-retirement.test" ./internal/supervisor
          sudo install -D -m 0755 "$RUNNER_TEMP/supervisor-retirement.test" /usr/lib/homenode-fixtures/supervisor-retirement.test
          sudo env HOMENODE_VIDEO_RETIREMENT_FS_INTEGRATION=1 HOMENODE_VIDEO_RETIREMENT_HARDLINK_NEGATIVE=1 /usr/lib/homenode-fixtures/supervisor-retirement.test -test.run='^TestNativeVideoRetirement((Socket|Volume|Directory)Scope|StartExclusion|Preflight|Resources)$' -test.v -test.timeout=2m | tee "$RUNNER_TEMP/video-retirement-socket.log"
          python3 -B - "$RUNNER_TEMP/video-retirement-socket.log" <<'PY'
          import pathlib, sys
          with pathlib.Path(sys.argv[1]).open('rb') as stream:
              output = stream.read((1 << 20) + 1)
          if len(output) > 1 << 20 or b'reserved video socket filesystem component passed;' not in output or b'hardlink-disabled refusal and restoration passed' not in output or b'reserved video volume filesystem component passed;' not in output or b'reserved video directory filesystem component passed;' not in output or b'reserved video start exclusion component passed;' not in output or b'reserved video volume preflight component passed;' not in output or b'reserved video physical sequence component passed;' not in output:
              raise SystemExit('native retirement component evidence missing or oversized')
          PY
      - name: Retain bounded component diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: video-retirement-socket-component
          path: ${{ runner.temp }}/video-retirement-socket.log
          if-no-files-found: ignore
          retention-days: 7
