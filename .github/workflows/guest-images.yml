name: Development guest images
on:
  push:
    branches: [main]
    paths:
      - 'packaging/guest/**'
      - 'internal/guest/**'
      - 'internal/guestmount/**'
      - 'internal/guestinit/**'
      - 'internal/supervisor/**'
      - 'internal/catalog/**'
      - 'internal/transfer/**'
      - 'internal/runtimeclient/**'
      - 'internal/control/**'
      - 'internal/identity/**'
      - 'internal/gatewaytransport/**'
      - 'internal/networkcheck/**'
      - 'cmd/homenode/**'
      - 'cmd/homenode-gateway/**'
      - 'web/**'
      - 'packaging/inspection/gateway_startup_fixture.py'
      - 'packaging/inspection/browser_fixture.py'
      - 'packaging/inspection/private_ingress_fixture.py'
      - 'packaging/systemd/homenode-control.service'
      - 'packaging/systemd/homenode-gateway.service'
      - 'packaging/systemd/reserved_manager_fixture.py'
      - 'cmd/homenode-guest*/**'
      - 'cmd/homenode-transfer/**'
      - 'cmd/homenode-supervisor/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/guest-images.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: Development image profile to qualify in this manual run
        type: choice
        default: both
        options: [both, files, video]
      files_https_bytes:
        description: Native HTTPS Files payload size (large case remains unqualified until its run passes)
        type: choice
        default: '32768'
        options: ['32768', '1073741824']
      files_browser:
        description: Qualify the actual browser UI through native Files services
        type: boolean
        default: false
      files_browser_bytes:
        description: Browser upload/download bytes (use bounded HTTPS protocol profile)
        type: choice
        default: '32768'
        options: ['32768', '1073741824']
permissions:
  contents: read
concurrency:
  group: guest-images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.profile == 'files' && '["files"]' || github.event_name == 'workflow_dispatch' && inputs.profile == 'video' && '["video"]' || '["files","video"]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        if: matrix.profile == 'files'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend for authenticated native Files workflow
        if: matrix.profile == 'files'
        working-directory: web
        run: npm ci && npm run build
      - name: Prepare sandboxed native browser qualification
        if: matrix.profile == 'files' && inputs.files_browser
        run: |
          test "${{ inputs.files_https_bytes || '32768' }}" = 32768
          go test -race ./cmd/homenode-gateway -run '^TestNativeBrowserInvitationPipeBoundary$' -count=1
          sudo apt-get update && sudo apt-get install -y libnss3-tools
          test -x /opt/google/chrome/chrome
          test "$(readlink -f /opt/google/chrome/chrome)" = /opt/google/chrome/chrome
          test -f /opt/google/chrome/chrome-sandbox
          test ! -L /opt/google/chrome/chrome-sandbox
          browser_fixture_digest=$(sha256sum /opt/google/chrome/chrome | cut -d ' ' -f1)
          stat -c 'Browser ancestor %n uid=%u gid=%g mode=%a' /opt /opt/google /opt/google/chrome
          sudo chown root:root /opt
          sudo chmod go-w /opt
          sudo chown --no-dereference -R root:root /opt/google/chrome
          sudo chmod -R go-w /opt/google/chrome
          sudo chown root:root /opt/google
          sudo chmod go-w /opt/google
          sudo chmod 4755 /opt/google/chrome/chrome-sandbox
          test "$(sha256sum /opt/google/chrome/chrome | cut -d ' ' -f1)" = "$browser_fixture_digest"
          sha256sum /opt/google/chrome/chrome
          stat -c 'Browser runtime uid=%u gid=%g mode=%a' /opt/google/chrome/chrome
          stat -c 'Browser sandbox helper uid=%u gid=%g mode=%a' /opt/google/chrome/chrome-sandbox
          /opt/google/chrome/chrome --version
          sudo install -D -m 0755 "$(command -v node)" /usr/lib/homenode-fixtures/node
          PYTHONPATH=packaging/inspection /usr/bin/python3 -B -c 'from browser_fixture import protected_program; protected_program("/usr/lib/homenode-fixtures/node"); protected_program("/opt/google/chrome/chrome"); print("PASS protected Node and Chrome runtime hierarchy")'
      - name: Install disposable image build dependencies
        run: sudo apt-get update && sudo apt-get install -y systemd-container dosfstools mtools grub-pc-bin e2fsprogs python3-pefile squashfs-tools qemu-system-x86 ffmpeg libvirt-clients libvirt-daemon-system
      - name: Stage and authenticate local development adapter overlay
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          sh packaging/guest/stage.sh "$PROFILE" "$RUNNER_TEMP/overlay-$PROFILE"
      - name: Package development adapter overlay
        env:
          PROFILE: ${{ matrix.profile }}
        run: python3 -u packaging/guest/overlay.py package "$RUNNER_TEMP/overlay-$PROFILE" "$RUNNER_TEMP/overlay-$PROFILE.tar" "$(git show -s --format=%ct HEAD)"
      - name: Fetch pinned image builder source
        run: |
          sudo git init "$RUNNER_TEMP/mkosi-source"
          sudo git -C "$RUNNER_TEMP/mkosi-source" remote add origin https://github.com/systemd/mkosi.git
          sudo git -C "$RUNNER_TEMP/mkosi-source" fetch --depth=1 origin 52448a27f6f869c108352ed82fcfb9be633703fb
          sudo git -C "$RUNNER_TEMP/mkosi-source" checkout --detach FETCH_HEAD
          sudo install -d -m 0700 "$RUNNER_TEMP/assembly"
      - name: Build unsigned development system disk
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          digest=$(sha256sum "$RUNNER_TEMP/overlay-$PROFILE.tar" | cut -d ' ' -f 1)
          sudo env HOMENODE_GUEST_IMAGE_BUILD=1 python3 packaging/guest/build_image.py "$RUNNER_TEMP/overlay-$PROFILE.tar" "$digest" "$PROFILE" "$(git rev-parse HEAD)" "$RUNNER_TEMP/assembly/$PROFILE" "$RUNNER_TEMP/mkosi-source"
          sudo chmod 0755 "$RUNNER_TEMP/assembly" "$RUNNER_TEMP/assembly/$PROFILE" "$RUNNER_TEMP/assembly/$PROFILE/artifacts"
          sudo chmod 0644 "$RUNNER_TEMP/assembly/$PROFILE/artifacts/"*
      - name: Boot development disk and round trip guest object
        env:
          PROFILE: ${{ matrix.profile }}
          HOMENODE_GUEST_BOOT_INTEGRATION: '1'
        run: python3 packaging/guest/boot_image.py "$RUNNER_TEMP/assembly/$PROFILE/artifacts/homenode-development-$PROFILE.raw" "$RUNNER_TEMP/assembly/$PROFILE/artifacts/development-build.json" "$RUNNER_TEMP/guest-boot-$PROFILE"
      - name: Boot development disk using accessible native KVM
        env:
          PROFILE: ${{ matrix.profile }}
          HOMENODE_GUEST_BOOT_INTEGRATION: '1'
          HOMENODE_GUEST_BOOT_ACCELERATOR: kvm
        run: |
          if test -c /dev/kvm && getent group kvm > /dev/null; then
            sudo /usr/sbin/runuser -u "$(id -un)" -g kvm -- env HOMENODE_GUEST_BOOT_INTEGRATION=1 HOMENODE_GUEST_BOOT_ACCELERATOR=kvm python3 -B packaging/guest/boot_image.py "$RUNNER_TEMP/assembly/$PROFILE/artifacts/homenode-development-$PROFILE.raw" "$RUNNER_TEMP/assembly/$PROFILE/artifacts/development-build.json" "$RUNNER_TEMP/guest-kvm-$PROFILE"
          else
            echo "Native KVM device or group unavailable; development boot evidence remains TCG-only."
          fi
      - name: Exercise Files image through reserved identity manager
        if: matrix.profile == 'files'
        run: |
          if test -c /dev/kvm; then
            go test -c -o "$RUNNER_TEMP/supervisor-memory.test" ./internal/supervisor
            sudo install -D -m 0755 "$RUNNER_TEMP/supervisor-memory.test" /usr/lib/homenode-fixtures/supervisor.test
            go build -o "$RUNNER_TEMP/homenode-supervisor" ./cmd/homenode-supervisor
            sudo install -D -m 0755 "$RUNNER_TEMP/homenode-supervisor" /usr/lib/homenode-fixtures/homenode-supervisor
            go build -o "$RUNNER_TEMP/homenode-transfer" ./cmd/homenode-transfer
            sudo install -D -m 0755 "$RUNNER_TEMP/homenode-transfer" /usr/lib/homenode-fixtures/homenode-transfer
            sudo systemctl start libvirtd
            sudo env HOMENODE_KVM_DOMAIN_INTEGRATION=1 HOMENODE_FILES_MANAGER_INTEGRATION=1 python3 -B packaging/systemd/reserved_manager_fixture.py "$(command -v go)" "$RUNNER_TEMP/assembly/files/artifacts/homenode-development-files.raw" "$RUNNER_TEMP/assembly/files/artifacts/development-build.json"
          else
            echo 'Development Files manager NOT VERIFIED: no native KVM device.'
          fi
      - name: Exercise authenticated HTTPS Files through actual native services
        if: matrix.profile == 'files'
        env:
          HOMENODE_FILES_HTTPS_BYTES: ${{ inputs.files_https_bytes || '32768' }}
          HOMENODE_FILES_BROWSER_INTEGRATION: ${{ inputs.files_browser && '1' || '0' }}
          HOMENODE_FILES_BROWSER_BYTES: ${{ inputs.files_browser_bytes || '32768' }}
        run: |
          if test -c /dev/kvm; then
            go build -o "$RUNNER_TEMP/homenode" ./cmd/homenode
            sudo install -D -m 0755 "$RUNNER_TEMP/homenode" /usr/lib/homenode-fixtures/homenode
            go build -o "$RUNNER_TEMP/homenode-gateway" ./cmd/homenode-gateway
            sudo install -D -m 0755 "$RUNNER_TEMP/homenode-gateway" /usr/lib/homenode-fixtures/homenode-gateway
            go test -c -o "$RUNNER_TEMP/https-identity.test" ./cmd/homenode-gateway
            sudo install -D -m 0755 "$RUNNER_TEMP/https-identity.test" /usr/lib/homenode-fixtures/https-identity.test
            sudo env HOMENODE_KVM_DOMAIN_INTEGRATION=1 HOMENODE_FILES_MANAGER_INTEGRATION=1 HOMENODE_FILES_HTTPS_INTEGRATION=1 HOMENODE_FILES_HTTPS_BYTES="$HOMENODE_FILES_HTTPS_BYTES" HOMENODE_FILES_BROWSER_INTEGRATION="$HOMENODE_FILES_BROWSER_INTEGRATION" HOMENODE_FILES_BROWSER_BYTES="$HOMENODE_FILES_BROWSER_BYTES" python3 -B packaging/systemd/reserved_manager_fixture.py "$(command -v go)" "$RUNNER_TEMP/assembly/files/artifacts/homenode-development-files.raw" "$RUNNER_TEMP/assembly/files/artifacts/development-build.json"
          else
            echo 'Authenticated native HTTPS Files NOT VERIFIED: no native KVM device.'
          fi
      - name: Retain bounded boot diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homenode-development-boot-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/guest-boot-${{ matrix.profile }}/boot-console.log
            ${{ runner.temp }}/guest-boot-${{ matrix.profile }}/boot-evidence.json
            ${{ runner.temp }}/guest-kvm-${{ matrix.profile }}/boot-console.log
            ${{ runner.temp }}/guest-kvm-${{ matrix.profile }}/boot-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain unsigned development disk and package inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homenode-development-guest-${{ matrix.profile }}
          path: ${{ runner.temp }}/assembly/${{ matrix.profile }}/artifacts/*
          if-no-files-found: error
          retention-days: 7
