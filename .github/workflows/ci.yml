name: HomeNode checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Install guest test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libvirt-clients libxml2-utils restic
      - name: Test Go and Linux adapters
        env:
          HOMENODE_GUEST_INTEGRATION: '1'
          HOMENODE_DOMAIN_SCHEMA_TEST: '1'
          HOMENODE_RESTIC_INTEGRATION: '1'
        run: go test -race ./...
      - name: Test installer ownership with root fixture
        run: sudo "$(command -v go)" test ./internal/install ./cmd/homenode-supervisor
      - run: go vet ./...
      - run: go build ./cmd/...
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Build and inspect development Debian package
        run: |
          packaging/debian/build.sh 0.1.0~ci
          dpkg-deb --info artifacts/homenode_0.1.0~ci_amd64.deb
          dpkg-deb --extract artifacts/homenode_0.1.0~ci_amd64.deb /tmp/homenode-package
          cd /tmp/homenode-package
          sha256sum --check usr/share/doc/homenode/SHA256SUMS
          test -x usr/bin/homenode
          test -f usr/share/homenode/web/index.html
          sudo apt-get install -y "$GITHUB_WORKSPACE/artifacts/homenode_0.1.0~ci_amd64.deb"
          systemd-analyze verify "$GITHUB_WORKSPACE"/packaging/systemd/*.service "$GITHUB_WORKSPACE"/packaging/systemd/*.slice
      - name: Inspect native service accounts with installed CLI
        run: sudo env HOMENODE_ACCOUNT_INSPECTION_INTEGRATION=1 "$(command -v go)" test ./internal/install -run '^TestInstalledAccountInspection$'
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: npm --prefix web run test:e2e
      - name: Retain verified development package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homenode-development-amd64
          path: artifacts/homenode_0.1.0~ci_amd64.deb*
          if-no-files-found: error
          retention-days: 14
