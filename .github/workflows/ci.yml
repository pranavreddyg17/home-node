name: HomeNode checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: true
      - name: Install guest test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libvirt-clients libxml2-utils
      - name: Test Go and Linux adapters
        env:
          HOMENODE_GUEST_INTEGRATION: '1'
          HOMENODE_DOMAIN_SCHEMA_TEST: '1'
        run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: npm --prefix web run test:e2e
