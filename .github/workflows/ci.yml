name: HomeNode checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.9'
          cache: true
      - name: Install guest test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libvirt-clients libvirt-daemon-system qemu-system-x86 libxml2-utils restic e2fsprogs
      - name: Test Go and Linux adapters
        env:
          HOMENODE_GUEST_INTEGRATION: '1'
          HOMENODE_DOMAIN_SCHEMA_TEST: '1'
          HOMENODE_RESTIC_INTEGRATION: '1'
          HOMENODE_FILESYSTEM_INTEGRATION: '1'
        run: go test -race ./...
      - name: Qualify KVM API when runner hardware is exposed
        run: |
          if test -c /dev/kvm; then
            sudo env HOMENODE_KVM_API_INTEGRATION=1 "$(command -v go)" test ./internal/hostcheck -run '^TestNativeKVMAPIAccess$' -count=1
            sudo env HOMENODE_KVM_API_INTEGRATION=1 "$(command -v go)" test ./internal/supervisor -run '^TestNativeKVMPrimaryGroupAccess$' -count=1
            go test -c -o "$RUNNER_TEMP/supervisor-memory.test" ./internal/supervisor
            sudo install -D -m 0755 "$RUNNER_TEMP/supervisor-memory.test" /usr/lib/homenode-fixtures/supervisor.test
            sudo systemctl start libvirtd
            sudo env HOMENODE_KVM_DOMAIN_INTEGRATION=1 "$(command -v go)" test ./internal/supervisor -run '^TestNativeReservedDACGuestConnect$' -count=1 -v
            sudo env HOMENODE_KVM_DOMAIN_INTEGRATION=1 "$(command -v go)" test ./internal/supervisor -run '^TestNativeReservedDACLibvirtLaunch$' -count=1 -v
            sudo env HOMENODE_KVM_DOMAIN_INTEGRATION=1 "$(command -v go)" test ./internal/supervisor -run '^TestNativeReservedDACManagerLaunch$' -count=1 -v
          else
            echo 'Native KVM API NOT VERIFIED: runner exposes no character device at /dev/kvm.'
          fi
      - name: Test inspection syscall candidate refusal before native effects
        run: python3 packaging/inspection/resolve_syscall_candidate_test.py
      - name: Test installer ownership with root fixture
        run: sudo env HOMENODE_UPDATE_INIT_INTEGRATION=1 "$(command -v go)" test ./internal/install ./cmd/homenode-supervisor -count=1 -v
      - name: Test reserved account exclusion with root fixture
        run: |
          sudo "$(command -v go)" test ./internal/accountlock -run '^TestRootLockRefusesParentPermissionDrift$' -count=1 -v
          sudo "$(command -v go)" test ./internal/supervisor -run '^TestRootReservedAccountScopeRefuses(Directory|Lock)Replacement$' -count=1 -v
      - name: Test recovery empty and populated kernel guest cgroup
        run: sudo env HOMENODE_RECOVERY_CGROUP_INTEGRATION=1 "$(command -v go)" test ./internal/install -run '^TestNativeRecoveryGuestCgroupObservation$' -count=1 -v
      - name: Test protected local guest UID account observation
        run: sudo env HOMENODE_GUEST_UID_ACCOUNTS_INTEGRATION=1 "$(command -v go)" test ./internal/supervisor -run '^TestNativeGuest(UIDLocalAccountObservation|DACProcessVerification|NSSNameServiceEligibility|AutomaticUIDAllocationEligibility|ChannelDirectoryOwnership|ChannelDACIsolation|ChannelRootListenerRefusal)$' -count=1
      - name: Test inspection completion with local system manager
        run: sudo env HOMENODE_INSPECT_COMPLETION_INTEGRATION=1 "$(command -v go)" test ./internal/updates -run '^TestNativeInspectionManagerCompletion$' -count=1
      - name: Test inspection result with local system journal
        run: sudo env HOMENODE_INSPECT_JOURNAL_INTEGRATION=1 "$(command -v go)" test ./internal/updates -run '^TestNativeInspectionJournalResult$' -count=1
      - name: Test inherited private backup listener
        run: sudo env HOMENODE_ACTIVATION_INTEGRATION=1 "$(command -v go)" test ./internal/socketactivation -run '^TestNativeInheritedPrivate(Packet)?Listener$'
      - name: Test isolated backup executable activation and shutdown
        run: sudo env HOMENODE_BACKUP_ENTRY_INTEGRATION=1 "$(command -v go)" test ./cmd/homenode-backup -run '^TestNativeBackupEntryActivation$'
      - name: Test controller credential socket admission
        run: sudo env HOMENODE_BACKUP_DISPATCH_INTEGRATION=1 "$(command -v go)" test ./internal/runtimeclient -run '^TestNativeBackupCredentialSocketAdmission$'
      - name: Test activated credential handoff across kernel identities
        run: sudo env HOMENODE_CREDENTIAL_INTEGRATION=1 "$(command -v go)" test ./internal/backup -run '^TestNativeActivatedCredential(Handoff|CompletionMismatch)$'
      - name: Test systemd activation of private backup listener
        run: |
          go test -c -o "$RUNNER_TEMP/activation.test" ./internal/socketactivation
          sudo install -d -m 0755 /usr/lib/homenode-fixtures
          sudo install -m 0755 "$RUNNER_TEMP/activation.test" /usr/lib/homenode-fixtures/activation.test
          sudo env HOMENODE_ACTIVATION_SYSTEMD_INTEGRATION=1 python3 packaging/maintenance/activation_fixture.py
          sudo env HOMENODE_ACTIVATION_SYSTEMD_INTEGRATION=1 HOMENODE_ACTIVATION_PACKET=1 python3 packaging/maintenance/activation_fixture.py
      - name: Test backup OOM observation ordering
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s packaging/maintenance -p 'oom_observation_test.py'
      - name: Test backup service OOM sibling termination
        timeout-minutes: 3
        run: sudo env PYTHONDONTWRITEBYTECODE=1 HOMENODE_BACKUP_OOM_INTEGRATION=1 python3 packaging/maintenance/oom_fixture.py
      - name: Test received maintenance disk admission with root fixture
        run: sudo env HOMENODE_DISK_TRANSPORT_ROOT_INTEGRATION=1 "$(command -v go)" test ./internal/disktransport -run '^TestNativeDiskAdmission$'
      - name: Test backup disk client across kernel identities
        run: sudo env HOMENODE_DISK_CLIENT_INTEGRATION=1 "$(command -v go)" test ./internal/runtimeclient -run '^TestNativeBackupDiskClient$'
      - name: Test guest object root ownership with disposable fixture
        run: sudo env HOMENODE_GUEST_ROOT_INTEGRATION=1 "$(command -v go)" test ./internal/guest -run '^TestNativeForeignDataRootPreserved$'
      - name: Test guest object directory initialization
        run: sudo env HOMENODE_GUEST_INIT_INTEGRATION=1 "$(command -v go)" test ./internal/guestinit
      - name: Test guest initializer with service capabilities
        run: sudo setpriv --bounding-set=-all,+chown,+dac_read_search --inh-caps=-all --ambient-caps=-all --no-new-privs env HOMENODE_GUEST_INIT_INTEGRATION=1 HOMENODE_GUEST_INIT_CAPABILITIES=1 "$(command -v go)" test -count=1 ./internal/guestinit -run '^TestNativeGuestObjectInitialization$'
      - name: Test guest initializer with source unit protections
        run: |
          go test -c -o "$RUNNER_TEMP/guest-init.test" ./internal/guestinit
          sudo install -d -m 0755 /usr/lib/homenode-fixtures
          sudo install -m 0755 "$RUNNER_TEMP/guest-init.test" /usr/lib/homenode-fixtures/guest-init.test
          sudo env HOMENODE_GUEST_SYSTEMD_INTEGRATION=1 python3 packaging/guest/systemd_fixture.py
      - name: Test guest runtime mount admission
        run: |
          go test -c -o "$RUNNER_TEMP/guestmount.test" ./internal/guestmount
          sudo install -m 0755 "$RUNNER_TEMP/guestmount.test" /usr/lib/homenode-fixtures/guestmount.test
          sudo env HOMENODE_GUEST_RUNTIME_INTEGRATION=1 python3 packaging/guest/runtime_fixture.py
      - name: Test fresh raw volume initialization
        run: sudo env HOMENODE_VOLUME_INTEGRATION=1 "$(command -v go)" test ./internal/supervisor -run '^TestNative(FreshVolumeFormattingPreservesExistingData|PreparedVolumeCleanup|VolumePublicationIdentity|GuestUIDVolumeAdmission|ReservedVolumeMountRefusal|MaintenanceVolume)$'
      - name: Test volume operations with supervisor source protections
        run: |
          go test -c -o "$RUNNER_TEMP/supervisor.test" ./internal/supervisor
          sudo install -m 0755 "$RUNNER_TEMP/supervisor.test" /usr/lib/homenode-fixtures/supervisor.test
          sudo env HOMENODE_SUPERVISOR_SYSTEMD_INTEGRATION=1 python3 packaging/systemd/supervisor_fixture.py
      - run: go vet ./...
      - name: Check reachable Go vulnerabilities
        timeout-minutes: 5
        run: |
          set -o pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/go-vulnerability-source-revision.txt"
          sha256sum go.mod go.sum > "$RUNNER_TEMP/go-vulnerability-source-inputs.sha256"
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -version > "$RUNNER_TEMP/go-vulnerability-scanner-version.txt"
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -show verbose ./... 2>&1 | tee "$RUNNER_TEMP/go-vulnerability-scan.txt"
      - run: go build ./cmd/...
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - name: Check frontend dependency vulnerabilities
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/frontend-vulnerability-scan"
          node --version > "$RUNNER_TEMP/frontend-vulnerability-scan/node-version.txt"
          npm --version > "$RUNNER_TEMP/frontend-vulnerability-scan/npm-version.txt"
          sha256sum web/package-lock.json > "$RUNNER_TEMP/frontend-vulnerability-scan/package-lock.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/frontend-vulnerability-scan/source-revision.txt"
          npm --prefix web audit --audit-level=high --json | tee "$RUNNER_TEMP/frontend-vulnerability-scan/audit.json"
      - name: Retain frontend vulnerability scan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-vulnerability-scan
          path: ${{ runner.temp }}/frontend-vulnerability-scan/
          if-no-files-found: ignore
          retention-days: 14
      - run: npm --prefix web run test:evidence
      - run: npm --prefix web run build
      - name: Build and inspect development Debian package
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 packaging/debian/sbom_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 packaging/debian/verify_frontend_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 packaging/debian/go_notices_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 packaging/debian/verify_go_notices_test.py
          packaging/debian/build.sh 0.1.0~ci
          (cd artifacts && sha256sum --check homenode_0.1.0~ci_amd64.deb.evidence.sha256)
          HOMENODE_PACKAGE_CONTENT_FIXTURE="$GITHUB_WORKSPACE/artifacts/homenode_0.1.0~ci_amd64.deb" go test ./internal/updates -run '^TestNativeBuiltPackage(Content|SBOM)$' -count=1
          sudo env HOMENODE_INSPECT_ENTRY_INTEGRATION=1 HOMENODE_PACKAGE_CONTENT_FIXTURE="$GITHUB_WORKSPACE/artifacts/homenode_0.1.0~ci_amd64.deb" "$(command -v go)" test ./cmd/homenode-inspect -run '^TestNativeInspectionDescriptor$' -count=1
          dpkg-deb --info artifacts/homenode_0.1.0~ci_amd64.deb
          dpkg-deb --extract artifacts/homenode_0.1.0~ci_amd64.deb /tmp/homenode-package
          python3 packaging/debian/verify_sbom.py /tmp/homenode-package artifacts/homenode_0.1.0~ci_amd64.deb 0.1.0~ci artifacts/homenode_0.1.0~ci_amd64.deb.sbom.json
          go run ./packaging/debian/modules /tmp/homenode-package go.sum > "$RUNNER_TEMP/extracted-gomodules.json"
          cmp artifacts/homenode_0.1.0~ci_amd64.deb.gomodules.json "$RUNNER_TEMP/extracted-gomodules.json"
          go mod verify
          go list -m -json all > "$RUNNER_TEMP/go-source-modules.json"
          PYTHONDONTWRITEBYTECODE=1 python3 packaging/debian/verify_go_notices.py "$RUNNER_TEMP/extracted-gomodules.json" "$RUNNER_TEMP/go-source-modules.json" artifacts/homenode_0.1.0~ci_amd64.deb.go-notices.json artifacts/homenode_0.1.0~ci_amd64.deb.go-notices.txt
          cp artifacts/homenode_0.1.0~ci_amd64.deb.go-notices.txt "$RUNNER_TEMP/changed-go-notices.txt"
          printf '\nforeign appended notice\n' >> "$RUNNER_TEMP/changed-go-notices.txt"
          if PYTHONDONTWRITEBYTECODE=1 python3 packaging/debian/verify_go_notices.py "$RUNNER_TEMP/extracted-gomodules.json" "$RUNNER_TEMP/go-source-modules.json" artifacts/homenode_0.1.0~ci_amd64.deb.go-notices.json "$RUNNER_TEMP/changed-go-notices.txt" 2> "$RUNNER_TEMP/changed-go-notices-error.txt"; then
            echo 'Changed readable Go notices were accepted' >&2
            exit 1
          fi
          grep -F 'readable Go notices differ from verified sources' "$RUNNER_TEMP/changed-go-notices-error.txt"
          go mod verify
          PYTHONDONTWRITEBYTECODE=1 python3 packaging/debian/verify_frontend.py /tmp/homenode-package/usr/share/homenode/web artifacts/homenode_0.1.0~ci_amd64.deb.frontend.json web/package-lock.json artifacts/homenode_0.1.0~ci_amd64.deb.frontend-notices.txt
          git status --short
          test -z "$(git status --porcelain)"
          cd /tmp/homenode-package
          sha256sum --check usr/share/doc/homenode/SHA256SUMS
          test -x usr/bin/homenode
          test -x usr/lib/homenode/homenode-backup
          file usr/lib/homenode/homenode-backup | grep -E 'ELF 64-bit.*x86-64'
          dpkg-deb --field "$GITHUB_WORKSPACE/artifacts/homenode_0.1.0~ci_amd64.deb" Depends | grep -w restic
          test -f usr/share/homenode/web/index.html
          sudo apt-get install -y "$GITHUB_WORKSPACE/artifacts/homenode_0.1.0~ci_amd64.deb"
          systemd-analyze verify "$GITHUB_WORKSPACE"/packaging/systemd/*.service "$GITHUB_WORKSPACE"/packaging/systemd/*.socket "$GITHUB_WORKSPACE"/packaging/systemd/*.slice
      - name: Check packaged Go binary vulnerabilities
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/go-binary-vulnerability-scans"
          for binary in usr/bin/homenode usr/lib/homenode/homenode-supervisor usr/lib/homenode/homenode-transfer usr/lib/homenode/homenode-backup usr/lib/homenode/homenode-inspect usr/lib/homenode/guest/homenode-guest; do
            sha256sum "/tmp/homenode-package/$binary" > "$RUNNER_TEMP/go-binary-vulnerability-scans/$(basename "$binary").sha256"
            go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode binary -show verbose "/tmp/homenode-package/$binary" 2>&1 | tee "$RUNNER_TEMP/go-binary-vulnerability-scans/$(basename "$binary").txt"
          done
      - name: Retain Go vulnerability scans
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-vulnerability-scans
          path: |
            ${{ runner.temp }}/go-vulnerability-scan.txt
            ${{ runner.temp }}/go-vulnerability-source-revision.txt
            ${{ runner.temp }}/go-vulnerability-source-inputs.sha256
            ${{ runner.temp }}/go-vulnerability-scanner-version.txt
            ${{ runner.temp }}/go-binary-vulnerability-scans/
          if-no-files-found: ignore
          retention-days: 14
      - name: Test package inspection with source service protections
        run: |
          go test -c -o "$RUNNER_TEMP/inspect.test" ./cmd/homenode-inspect
          sudo install -d -m 0755 /usr/lib/homenode-fixtures
          sudo install -m 0755 "$RUNNER_TEMP/inspect.test" /usr/lib/homenode-fixtures/inspect.test
          sudo env HOMENODE_INSPECT_SYSTEMD_INTEGRATION=1 HOMENODE_PACKAGE_CONTENT_FIXTURE="$GITHUB_WORKSPACE/artifacts/homenode_0.1.0~ci_amd64.deb" python3 packaging/inspection/systemd_fixture.py
      - name: Build verified guest adapter overlays
        run: |
          python3 packaging/guest/overlay_test.py
          python3 packaging/guest/import_overlay_test.py
          python3 packaging/guest/finalize_root_test.py
          python3 packaging/guest/boot_image_test.py
          for profile in files video ai; do
            sh packaging/guest/stage.sh "$profile" "$RUNNER_TEMP/homenode-guest-$profile"
            epoch=$(git show -s --format=%ct HEAD)
            python3 packaging/guest/overlay.py package "$RUNNER_TEMP/homenode-guest-$profile" "$RUNNER_TEMP/homenode-guest-$profile.tar" "$epoch"
            python3 packaging/guest/overlay.py package "$RUNNER_TEMP/homenode-guest-$profile" "$RUNNER_TEMP/homenode-guest-$profile-repeat.tar" "$epoch"
            cmp "$RUNNER_TEMP/homenode-guest-$profile.tar" "$RUNNER_TEMP/homenode-guest-$profile-repeat.tar"
            digest=$(sha256sum "$RUNNER_TEMP/homenode-guest-$profile.tar" | cut -d " " -f 1)
            python3 packaging/guest/import_overlay.py "$RUNNER_TEMP/homenode-guest-$profile.tar" "$RUNNER_TEMP/homenode-guest-$profile-imported" "$digest" "$profile" "$(git rev-parse HEAD)"
            python3 packaging/guest/overlay.py verify "$RUNNER_TEMP/homenode-guest-$profile-imported"
          done
      - name: Validate native guest image identity
        run: sudo env HOMENODE_GUEST_ACCOUNT_INTEGRATION=1 python3 packaging/guest/identity_test.py
      - name: Validate guest ephemeral directory creation
        run: sudo env HOMENODE_GUEST_VOLATILE_INTEGRATION=1 python3 packaging/guest/volatile_test.py
      - name: Validate guest service source
        run: |
          test "$(systemd-escape --path --suffix=device /dev/virtio-ports/org.homenode.adapter)" = 'dev-virtio\x2dports-org.homenode.adapter.device'
          sudo install -m 0755 "$RUNNER_TEMP/homenode-guest-files/usr/lib/homenode/guest/homenode-guest-init" /usr/lib/homenode/guest/homenode-guest-init
          systemd-analyze verify packaging/guest/tmp.mount packaging/guest/var.mount packaging/guest/data.mount packaging/guest/homenode-data-init.service packaging/guest/homenode-guest@.service
      - name: Inspect native service accounts with installed CLI
        run: sudo env HOMENODE_ACCOUNT_INSPECTION_INTEGRATION=1 "$(command -v go)" test ./internal/install -run '^TestInstalledAccountInspection$' -count=1 -v
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: npm --prefix web run test:e2e
      - name: Retain verified development package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homenode-development-amd64
          path: artifacts/homenode_0.1.0~ci_amd64.deb*
          if-no-files-found: error
          retention-days: 14
      - name: Retain unsigned guest adapter overlays
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homenode-guest-adapter-overlays-unsigned
          path: |
            ${{ runner.temp }}/homenode-guest-files.tar
            ${{ runner.temp }}/homenode-guest-video.tar
            ${{ runner.temp }}/homenode-guest-ai.tar
          if-no-files-found: error
          retention-days: 14
